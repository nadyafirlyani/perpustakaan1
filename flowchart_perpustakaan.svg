<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="680" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Beranda -->
  <rect x="230" y="40" width="220" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="340" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">Beranda</text>

  <line x1="340" y1="84" x2="340" y2="140" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Login sistem -->
  <rect x="230" y="140" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="340" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#042C53">Login sistem</text>
  <text x="340" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0C447C">Pilih peran login</text>

  <!-- Connectors -->
  <path d="M340 196 L340 230 L140 230 L140 260" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M340 196 L340 260" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M340 196 L340 230 L540 230 L540 260" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Login siswa -->
  <rect x="50" y="260" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="140" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#04342C">Login siswa</text>
  <text x="140" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Cari &amp; pinjam buku</text>

  <!-- Login petugas -->
  <rect x="250" y="260" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#26215C">Login petugas</text>
  <text x="340" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">Layani transaksi</text>

  <!-- Login admin -->
  <rect x="450" y="260" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="540" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4A1B0C">Login admin</text>
  <text x="540" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#712B13">Kelola sistem</text>
</svg>
